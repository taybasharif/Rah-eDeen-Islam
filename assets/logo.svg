<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#855806" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Islamic Emblem (Rub-el-Hizb & Crescent) -->
  <g transform="translate(80, 80)">
    <!-- Outer Rotated Squares -->
    <rect x="-42" y="-42" width="84" height="84" rx="6" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="-42" y="-42" width="84" height="84" rx="6" transform="rotate(45)" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="28" fill="#022C22" stroke="url(#goldGrad)" stroke-width="1.8" />
    
    <!-- Crescent & Star Detail -->
    <path d="M-6,-16 A16,16 0 1,0 12,12 A19,19 0 1,1 -6,-16 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <polygon points="4,-6 6,-1 11,-1 7,2 9,7 4,4 0,7 2,2 -2,-1 3,-1" fill="url(#goldGrad)" />
  </g>

  <!-- Calligraphy & Main Typography -->
  <g transform="translate(160, 50)">
    <!-- Quranic Bismillah Arch / Deco top -->
    <path d="M 0,2 Q 180,-12 360,2" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" />
    <circle cx="180" cy="-6" r="3.5" fill="url(#goldGrad)" />
    
    <!-- Main Arabic / Urdu Brand Name -->
    <text x="360" y="44" text-anchor="end" font-family="'Noto Nastaliq Urdu', 'Amiri', 'Traditional Arabic', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" filter="url(#goldGlow)">
      راہِ دینِ اسلام
    </text>

    <!-- Subtitle / English & Urdu Motto -->
    <text x="360" y="74" text-anchor="end" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" letter-spacing="3" fill="#E2D9C8">
      RAH-E-DEEN-ISLAM • مستند دینی علم و رہنمائی
    </text>
    
    <!-- Tagline -->
    <text x="360" y="94" text-anchor="end" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaliq', serif" font-size="13" fill="#D4AF37">
      علم، عمل اور اللہ پاک کی رضا کی جانب ایک سفر
    </text>
  </g>
</svg>
